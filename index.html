<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Kitchen Brawl: Remix Edition</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <div id="ui-layer">
            <div class="player-container" id="p1-container">
                <div class="player-name">BLAZE TOASTER-X</div>
                <div class="score" id="p1-score">Wins: 0</div>
                <div class="health-wrapper">
                    <div class="health-bar-bg"></div>
                    <div id="player-health-damage" class="health-bar-damage"></div>
                    <div id="player-health" class="health-bar"></div>
                </div>
                <div class="energy-wrapper">
                    <div id="player-energy" class="energy-bar"></div>
                </div>
            </div>

            <div id="timer">75</div>

            <div class="player-container" id="p2-container">
                <div class="player-name">VOID MICROWAVE-9</div>
                <div class="score" id="p2-score">Wins: 0</div>
                <div class="health-wrapper">
                    <div class="health-bar-bg"></div>
                    <div id="enemy-health-damage" class="health-bar-damage"></div>
                    <div id="enemy-health" class="health-bar"></div>
                </div>
                <div class="energy-wrapper">
                    <div id="enemy-energy" class="energy-bar"></div>
                </div>
            </div>
        </div>

        <div id="display-text">Press Start in the Main Menu</div>

        <div id="main-menu">
            <h1>Neon Kitchen Brawl</h1>
            <div class="menu-settings">
                <div class="setting-group">
                    <label for="round-time">Time</label>
                    <select id="round-time">
                        <option value="45">45s</option>
                        <option value="75" selected>75s</option>
                        <option value="99">99s</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label for="rounds-to-win">Rounds</label>
                    <select id="rounds-to-win">
                        <option value="1">1</option>
                        <option value="2" selected>2</option>
                        <option value="3">3</option>
                        <option value="5">5</option>
                    </select>
                </div>
            </div>
            <div class="menu-buttons">
                <button id="btn-pvp">Duel: Human vs Human</button>
                <button id="btn-cpu">Duel: Human vs AI</button>
            </div>
            <p style="font-size: 10px;">Controls: P1 (WASD, Space=Att, S=Block, F=Shoot, R=Overdrive) | P2 (Arrows, Enter=Att, Down=Block, Shift=Shoot, /=Overdrive)</p>
        </div>

        <button id="pause-btn" style="display: none;">Pause</button>

        <div id="game-over-menu" style="display: none;">
            <h1 id="game-over-result">Player 1 Wins</h1>
            <div class="menu-buttons">
                <button id="btn-rematch">Rematch</button>
                <button id="btn-home">Main Menu</button>
            </div>
        </div>

        <div id="pause-menu">
            <h1>Paused</h1>
            <div class="menu-buttons">
                <button id="btn-resume">Resume</button>
                <button id="btn-menu">Main Menu</button>
            </div>
        </div>

        <canvas id="game-canvas"></canvas>
    </div>

    <script type="module" src="./src/index.js"></script>
</body>
</html>
